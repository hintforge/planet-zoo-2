<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planet Zoo 2: Accreditation tree</title>
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --text:#1f2a24; --muted:#56635b; --line:#c9cfc5;
  --career:#1d6b57; --franchise:#8a4a10; --accent:var(--career); --on-accent:#ffffff;
  --soft:#eef3ee; --warn:#7a3b00; --warnbg:#fff3df; --focus:#0b57d0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131c17; --card:#1c2721; --text:#e8efe9; --muted:#a9b8ae; --line:#3a4a41;
    --career:#4fb899; --franchise:#e0a15a; --on-accent:#08140f;
    --soft:#243229; --warn:#ffd08a; --warnbg:#3a2a12; --focus:#8ab4ff;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.franchise{--accent:var(--franchise)}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}
h1{font-size:1.6rem;line-height:1.2;margin:.2rem 0 .5rem}
h2{font-size:1.2rem;margin:0 0 .4rem}
h3{font-size:1.05rem;margin:0}
.lede{color:var(--muted);margin:.25rem 0 .75rem;max-width:62ch}
.srcs{font-size:.85rem;color:var(--muted);margin:.4rem 0 0}
.srcs a{color:var(--muted)}
.toolbar{display:grid;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;margin:.8rem 0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.modes button{min-height:46px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.search{display:flex;gap:.5rem;align-items:center}
.search input[type=search]{flex:1;min-width:0;min-height:44px;padding:.3rem .7rem;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem}
.filters label{display:inline-flex;gap:.45rem;align-items:center;min-height:36px}
.filters input{width:1.15rem;height:1.15rem}
.status{font-size:.95rem;color:var(--muted);margin:0}
.plainbtn{min-height:40px;padding:.2rem .8rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.layout{display:grid;gap:1rem;grid-template-columns:1fr}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.tiers{list-style:none;margin:0;padding:0}
.tier{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:.7rem}
.rail{display:flex;flex-direction:column;align-items:center}
.num{width:2.5rem;height:2.5rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;flex:none}
.rail::after{content:"";flex:1;width:3px;background:var(--line);margin:3px 0}
.tier:last-child .rail::after{display:none}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;margin-bottom:.9rem;min-width:0}
.thead{display:flex;flex-wrap:wrap;gap:.3rem .7rem;align-items:baseline;justify-content:space-between}
.pill{background:var(--soft);border-radius:99px;padding:.1rem .7rem;font-weight:600;font-size:.95rem}
.gate{margin:.4rem 0 0}
.also{margin:.25rem 0 0;color:var(--muted);font-size:.95rem}
.toggle{margin-top:.6rem;width:100%;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-weight:600}
.toggle[aria-expanded="true"]{border-color:var(--accent)}
.chips{list-style:none;margin:.6rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
.chip{min-height:40px;padding:.2rem .7rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:600}
.chip small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.badge{display:inline-block;font-size:.75rem;font-weight:700;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:0 .4rem;margin-left:.3rem;vertical-align:middle}
.empty{color:var(--muted);margin:.5rem 0 0}
#detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;min-width:0}
@media (min-width:900px){#detail{position:sticky;top:.75rem;max-height:calc(100vh - 1.5rem);overflow:auto}}
@media (max-width:899px){
  #detail.has-sel{position:fixed;left:0;right:0;bottom:0;max-height:84vh;overflow:auto;border-radius:18px 18px 0 0;z-index:20;box-shadow:0 -8px 30px rgba(0,0,0,.35)}
  #detail:not(.has-sel){display:none}
  #scrim.on{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
}
#scrim{display:none}
@media (max-width:899px){#scrim.on{display:block}}
.dhead{display:flex;justify-content:space-between;gap:.5rem;align-items:flex-start}
.close{min-height:44px;min-width:44px;border:2px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.sec{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line)}
.ladder{list-style:none;margin:.3rem 0 0;padding:0;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.ladder li{min-width:2.3rem;height:2.3rem;padding:0 .4rem;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.ladder li+li::before{content:none}
.ladder li.done{background:var(--soft);color:var(--text)}
.ladder li.here{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ladder .arrow{border:none;min-width:auto;height:auto;padding:0}
.rtree{list-style:none;margin:.6rem 0 0;padding:0}
.rtree>li{position:relative;margin:0 0 .5rem 0;padding:.5rem .7rem .5rem .7rem;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.rtree>li+li::before{content:"";position:absolute;left:1.2rem;top:-.55rem;height:.5rem;width:3px;background:var(--line)}
.rtree .lv{font-weight:700;margin-right:.4rem}
.rtree .gatenode{border-style:dashed;border-color:var(--accent);background:var(--soft)}
.rtree .tag{display:inline-block;font-size:.75rem;border-radius:6px;padding:0 .4rem;margin-left:.3rem;background:var(--soft);border:1px solid var(--line)}
.slot{border:2px dashed var(--line);border-radius:10px;padding:.7rem;margin-top:.6rem}
.slot p{margin:0 0 .5rem}
.slot ul{margin:.3rem 0 0;padding-left:1.2rem}
.revealbtn{min-height:36px;border:2px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;padding:0 .6rem}
.tiny{font-size:.85rem;color:var(--muted)}
.hint{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Planet Zoo 2: Accreditation tree</h1>
    <p class="lede" id="intro"></p>
  </header>

  <section class="toolbar" aria-label="Choose a mode and find an animal">
    <div class="modes" role="group" aria-label="Game mode">
      <button type="button" id="m-career" aria-pressed="true">Career</button>
      <button type="button" id="m-franchise" aria-pressed="false">Franchise</button>
    </div>
    <div class="search">
      <input type="search" id="q" placeholder="Search animals by name" aria-label="Search animals by name" autocomplete="off">
      <button type="button" class="plainbtn" id="clear">Clear</button>
    </div>
    <div class="filters" role="group" aria-label="Filters">
      <label><input type="checkbox" id="f-deluxe"> Deluxe Edition only</label>
      <label><input type="checkbox" id="f-rel"> Has a release group</label>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <div class="layout">
    <section aria-labelledby="flow-title">
      <h2 id="flow-title">The ladder</h2>
      <p class="hint" id="flow-help"></p>
      <ol class="tiers" id="flow"></ol>
    </section>
    <aside id="detail" aria-label="Animal details">
      <p class="hint" id="detail-empty">Tap an animal to see where it sits in both modes, how to get it, and what its research looks like.</p>
      <div id="detail-body" hidden></div>
    </aside>
  </div>
  <div id="scrim"></div>
  <noscript><p>This page needs JavaScript to show the tree.</p></noscript>
</div>

    if(t.extras && t.extras.length){card.appendChild(el('p',{'class':'also',text:'Also hands you: '+extrasText(t.extras)}));}
    var sl = srcLine(t.sources); if(sl){card.appendChild(sl);}
    if(all.length && filtering() && !hit.length){
      card.appendChild(el('p',{'class':'empty',text:'No animals here match.'}));
    } else if(all.length){
      var listId = 'chips-'+key;
      var btn = el('button',{type:'button','class':'toggle','aria-expanded':open,'aria-controls':listId,
        text:(open?'Hide':'Show')+' the '+(filtering()?'matching ':'')+'animals in tier '+t.n});
      btn.addEventListener('click',function(){state.open[key]=!open;renderFlow();});
      card.appendChild(btn);
      var ul = el('ul',{'class':'chips',id:listId});
      if(!open){ul.hidden=true;}
      if(!hit.length){ul.appendChild(el('li',{'class':'empty',text:'No animals here match.'}));}
      hit.forEach(function(s){
        var other = mode==='career'?'franchise':'career';
        var b = el('button',{type:'button','class':'chip','aria-pressed':state.sel===s.name,'data-species':s.name},[
          s.name, s.deluxe?el('span',{'class':'badge',text:'Deluxe'}):null,
          el('small',{text:modeName(other)+' tier '+s[other]})
        ]);
        b.addEventListener('click',function(){select(s.name,true);});
        ul.appendChild(el('li',null,[b]));
      });
      card.appendChild(ul);
    }
    list.appendChild(el('li',{'class':'tier','data-tier':t.n},[
      el('div',{'class':'rail'},[el('span',{'class':'num','aria-hidden':'true',text:String(t.n)})]), card]));
  });
  var last = tiers[tiers.length-1];
  document.getElementById('flow-help').textContent = modeName(mode)+' has '+tiers.length+' tiers'+
    (SP.filter(function(s){return s[mode]===last.n;}).length===0 ? '; the last one adds no new animals' : '')+
    '. Tap a tier to see its animals, then tap an animal for details.';
  document.getElementById('status').textContent = filtering()
    ? ('Showing '+shown+' of '+plural(total,'animal')+' in '+modeName(mode)+'.')
    : (plural(total,'animal')+' across '+tiers.length+' tiers in '+modeName(mode)+'. Research documented for '+D.coverage.documented+' of '+D.coverage.total+' species.');
}

/* ---------------------------------------------------------------- detail */
function ladder(mode, tier){
  var ol = el('ol',{'class':'ladder','aria-label':modeName(mode)+' ladder'}), n, cls, lab;
  var tiers = tiersOf(mode);
  tiers.forEach(function(t){
    n = t.n;
    cls = n<tier?'done':(n===tier?'here':'');
    lab = n===tier?('Tier '+n+', where this animal unlocks'):(n<tier?('Tier '+n+', reached before it'):('Tier '+n+', after it'));
    if(n>1){ol.appendChild(el('li',{'class':'arrow','aria-hidden':'true',text:'→'}));}
    ol.appendChild(el('li',{'class':cls,'aria-label':lab,text:String(n)}));
  });
  return ol;
}
function tierBlock(mode, s){
  var t = tiersOf(mode).filter(function(x){return x.n===s[mode];})[0];
  var d = el('div');
  d.appendChild(el('h3',{text:modeName(mode)+': tier '+s[mode]}));
  d.appendChild(ladder(mode, s[mode]));
  d.appendChild(el('p',{'class':'gate'},[el('strong',{text:'To reach it: '}),t?t.gate:'']));
  return d;
}
function releaseText(s){
  if(s.release==='yes'){return 'A release group is listed for this animal.';}
  if(s.release==='reserve'){return 'It appears on a Wildlife Reserve’s release list.';}
  if(s.release==='none'){return 'No release group is listed in the guide’s sources. That does not say release is impossible.';}
  return 'Not known yet whether it has a release group.';
}
function reserveNode(g, sp){
  var holder = el('span');
  function paint(){
    holder.textContent='';
    var secret = (!g.reserve && state.revealed[sp]) ? hiddenGate(sp) : null;
    if(g.reserve || secret){
      holder.appendChild(document.createTextNode(g.reserve || secret.reserve));
    } else {
      holder.appendChild(document.createTextNode('a Wildlife Reserve '));
      var b = el('button',{type:'button','class':'revealbtn',text:'Show which one'});
      b.addEventListener('click',function(){state.revealed[sp]=true;paint();});
      holder.appendChild(b);
    }
  }
  paint();
  return holder;
}
function researchBlock(s){
  var box = el('div',{'class':'sec'});
  box.appendChild(el('h3',{text:'Research'}));
  box.appendChild(el('p',{'class':'tiny',text:'Research documented for '+D.coverage.documented+' of '+D.coverage.total+' species.'}));
  var r = s.research, F = D.research;
  if(r){
    var ol = el('ol',{'class':'rtree'});
    r.steps.forEach(function(st){
      if(r.gate && r.gate.before_level===st.n){
        var g = r.gate;
        ol.appendChild(el('li',{'class':'gatenode'},[
          el('strong',{text:'Gate before level '+st.n+': '}),
          'set up an Observation Network in ',
          reserveNode(g, s.name),
          ' and release this animal there.']));
      }
      var li = el('li',null,[el('span',{'class':'lv',text:'Level '+st.n}), st.text]);
      st.tags.forEach(function(tg){
        var lab = {fertility:'fertility',factsheet:'fact sheet',release:'release groups',thriving:'thriving requirement'}[tg];
        if(lab){li.appendChild(el('span',{'class':'tag',text:lab}));}
      });
      ol.appendChild(li);
    });
    box.appendChild(ol);
    if(r.gate && r.gate.before_level===null){box.appendChild(el('p',{text:'Gate: '+r.gate.raw}));}
    if(!r.gate){box.appendChild(el('p',{'class':'tiny',text:'No Observation Network gate is listed for this animal.'}));}
    if(r.note){box.appendChild(el('p',{'class':'tiny',text:r.note+'.'}));}
    var sl = srcLine(r.src); if(sl){box.appendChild(sl);}
    return box;
  }
  var slot = el('div',{'class':'slot'});
  slot.appendChild(el('p',{},[el('strong',{text:'Not documented yet. '}),
    'Have the game? Screenshot this animal’s research screen and give it to your Hintforge companion — it will add the levels here.']));
  var sp = F.spread, ul = el('ul');
  ul.appendChild(el('li',{text:'Levels: 3 to 6 for this animal (the exact number is not documented). Across all '+D.coverage.total+' animals, '+
    sp['3']+' have 3 levels, '+sp['4']+' have 4, '+sp['5']+' have 5 and '+sp['6']+' have 6.'}));
  if(F.grv_gated.indexOf(s.name)>=0){
    ul.appendChild(el('li',{text:'Observation Network gate: this animal is on the guide’s list of '+F.grv_gated.length+
      ' species whose later levels need an Observation Network in the Great Rift Valley reserve. Which level it sits before is not documented; on the 6-level pages the guide has read, it sits before level 4.'}));
  } else {
    ul.appendChild(el('li',{text:'Observation Network gate: '+F.gated_total+' of '+D.coverage.total+
      ' animals have one, but the guide names only '+F.grv_gated.length+' of them, so whether this animal has one is not documented.'}));
  }
  if(s.release_research_level){
    ul.appendChild(el('li',{text:'Its release group needs research level '+s.release_research_level+'.'}));
  } else if(s.release_no_research){
    ul.appendChild(el('li',{text:'Its release group needs no research.'}));
  }
  slot.appendChild(ul);
  // placeholder level chain, dashed, so the shape of the tree is visible
  box.appendChild(slot);
  var sl2 = srcLine(F.framework_src, 'Source for the level spread and gate counts: ');
  if(sl2){box.appendChild(sl2);}
  return box;
}
function renderDetail(){
  var body = document.getElementById('detail-body'), box = document.getElementById('detail'),
      empty = document.getElementById('detail-empty'), scrim = document.getElementById('scrim');
  var s = state.sel ? BY[state.sel] : null;
  body.textContent='';
  if(!s){body.hidden=true;empty.hidden=false;box.classList.remove('has-sel');scrim.classList.remove('on');return;}
  body.hidden=false;empty.hidden=true;box.classList.add('has-sel');scrim.classList.add('on');
  var close = el('button',{type:'button','class':'close','aria-label':'Close details',text:'✕'});
  close.addEventListener('click',function(){select(null,false);});
  var h = el('h2',{id:'dname',tabindex:'-1',text:s.name});
  if(s.deluxe){h.appendChild(el('span',{'class':'badge',text:'Deluxe Edition'}));}
  body.appendChild(el('div',{'class':'dhead'},[h,close]));

  var tiersSec = el('div',{'class':'sec'});
  tiersSec.appendChild(el('h3',{text:'Where it unlocks'}));
  tiersSec.appendChild(el('p',{text:'Career tier '+s.career+' and Franchise tier '+s.franchise+'.'}));
  tiersSec.appendChild(tierBlock('career',s));
  tiersSec.appendChild(tierBlock('franchise',s));
  var sl = srcLine(s.src.tier,'Tier source: '); if(sl){tiersSec.appendChild(sl);}
  body.appendChild(tiersSec);

  var how = el('div',{'class':'sec'});
  how.appendChild(el('h3',{text:'How to get it'}));
  how.appendChild(el('p',{text:D.how_obtained}));
  var s2 = srcLine(D.how_src); if(s2){how.appendChild(s2);}
  body.appendChild(how);

  var gates = el('div',{'class':'sec'});
  gates.appendChild(el('h3',{text:'Other gates'}));
  var gl = el('ul');
  if(s.deluxe){gl.appendChild(el('li',{text:'Deluxe Edition. Owning Deluxe does not skip tiers, and reaching a tier does not give you Deluxe animals you do not own.'}));}
  if(s.release_research_level){gl.appendChild(el('li',{text:'Its release group needs research level '+s.release_research_level+'.'}));}
  if(s.release_no_research){gl.appendChild(el('li',{text:'Its release group needs no research.'}));}
  var anyGate = s.deluxe || s.release_research_level || s.release_no_research;
  if(!anyGate){gl.appendChild(el('li',{text:'None recorded in the guide.'}));}
  gates.appendChild(gl);
  if(anyGate){var s3 = srcLine(D.other_gates_src); if(s3){gates.appendChild(s3);}}
  body.appendChild(gates);

  var rel = el('div',{'class':'sec'});
  rel.appendChild(el('h3',{text:'Release group'}));
  rel.appendChild(el('p',{text:releaseText(s)}));
  var s4 = srcLine(s.src.release); if(s4){rel.appendChild(s4);}
  body.appendChild(rel);

  body.appendChild(researchBlock(s));
}
function select(name, focus){
  state.sel = name;
  renderFlow();renderDetail();syncHash();
  if(name && focus){var h=document.getElementById('dname');if(h){h.focus({preventScroll:false});}}
}

/* ------------------------------------------------------------------ state */
function syncHash(){
  var parts = ['mode='+state.mode];
  if(state.sel){parts.push('animal='+encodeURIComponent(state.sel));}
  if(state.q){parts.push('q='+encodeURIComponent(state.q));}
  if(state.deluxe){parts.push('deluxe=1');}
  if(state.rel){parts.push('release=1');}
  try{history.replaceState(null,'','#'+parts.join('&'));}catch(e){}
}
function readHash(){
  var h = location.hash.replace(/^#/,''), p, kv;
  if(!h){return;}
  h.split('&').forEach(function(x){
    kv = x.split('=');
    var v = decodeURIComponent(kv.slice(1).join('='));
    if(kv[0]==='mode' && D.modes[v]){state.mode=v;}
    if(kv[0]==='animal' && BY[v]){state.sel=v;}
    if(kv[0]==='q'){state.q=v;}
    if(kv[0]==='deluxe'){state.deluxe=v==='1';}
    if(kv[0]==='release'){state.rel=v==='1';}
  });
}
function bind(){
  function setMode(m){state.mode=m;state.open={};renderFlow();syncHash();if(state.sel){renderDetail();}}
  document.getElementById('m-career').addEventListener('click',function(){setMode('career');});
  document.getElementById('m-franchise').addEventListener('click',function(){setMode('franchise');});
  function refilter(){state.open={};renderFlow();syncHash();}
  var q = document.getElementById('q');
  q.addEventListener('input',function(){state.q=q.value;refilter();});
  document.getElementById('f-deluxe').addEventListener('change',function(e){state.deluxe=e.target.checked;refilter();});
  document.getElementById('f-rel').addEventListener('change',function(e){state.rel=e.target.checked;refilter();});
  document.getElementById('clear').addEventListener('click',function(){
    state.q='';state.deluxe=false;state.rel=false;q.value='';
    document.getElementById('f-deluxe').checked=false;document.getElementById('f-rel').checked=false;refilter();});
  document.getElementById('scrim').addEventListener('click',function(){select(null,false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.sel){select(null,false);}});
}
readHash();
document.getElementById('q').value = state.q;
document.getElementById('f-deluxe').checked = state.deluxe;
document.getElementById('f-rel').checked = state.rel;
renderIntro();bind();renderFlow();renderDetail();
})();
</script>
</body>
